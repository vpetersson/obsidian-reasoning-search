name: Release

# Pushing a bare version tag (e.g. 0.1.1, no "v") publishes a GitHub release with
# main.js, manifest.json and styles.css attached as separate assets. That is the
# layout Obsidian's community plugin store and BRAT install from.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null \
            || { echo "::error::versions.json has no entry for $version"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
